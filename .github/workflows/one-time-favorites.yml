name: One-time favorites integration

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  integrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Integrate favorites page
        shell: python
        run: |
          from pathlib import Path

          path = Path('src/App.jsx')
          text = path.read_text()

          old_import = "import FamilyPage from './components/FamilyPage.jsx'\n"
          new_import = old_import + "import FavoritesPage from './components/FavoritesPage.jsx'\n"
          if "import FavoritesPage from './components/FavoritesPage.jsx'" not in text:
              text = text.replace(old_import, new_import, 1)

          old_block = """      {['home','grandma','favorites'].includes(activePage) && <><section className=\"hero\"><p className=\"hero-kicker\">{page.kicker}</p><h2>{page.title}</h2><p className=\"hero-text\">{page.text}</p>{activePage === 'home' && <div className=\"hero-actions\"><button type=\"button\" className=\"primary-button\" onClick={() => goTo('recipes')}>Voir les recettes</button><button type=\"button\" className=\"secondary-button\" onClick={() => goTo('grandma')}>Recettes de Mamie</button></div>}</section>{activePage === 'home' && <section className=\"section-preview\"><div className=\"section-heading\"><div><p className=\"section-kicker\">À découvrir</p><h3>Votre livre de recettes</h3></div></div><div className=\"preview-grid\"><button className=\"preview-card featured\" type=\"button\" onClick={() => goTo('grandma')}><span className=\"card-icon\">📖</span><h4>Recettes de Mamie</h4><p>Les recettes originales et leurs documents manuscrits.</p></button><button className=\"preview-card\" type=\"button\" onClick={() => goTo('recipes')}><span className=\"card-icon\">👨‍👩‍👧‍👦</span><h4>Recettes de la famille</h4><p>Les recettes partagées et enrichies par chacun.</p></button><button className=\"preview-card\" type=\"button\" onClick={() => goTo('favorites')}><span className=\"card-icon\">❤️</span><h4>Mes favoris</h4><p>Retrouvez rapidement les recettes que vous aimez.</p></button></div></section>}</>}"""
          new_block = """      {activePage === 'favorites' && <FavoritesPage user={user} onOpen={openRecipe} />}\n      {['home','grandma'].includes(activePage) && <><section className=\"hero\"><p className=\"hero-kicker\">{page.kicker}</p><h2>{page.title}</h2><p className=\"hero-text\">{page.text}</p>{activePage === 'home' && <div className=\"hero-actions\"><button type=\"button\" className=\"primary-button\" onClick={() => goTo('recipes')}>Voir les recettes</button><button type=\"button\" className=\"secondary-button\" onClick={() => goTo('grandma')}>Recettes de Mamie</button></div>}</section>{activePage === 'home' && <section className=\"section-preview\"><div className=\"section-heading\"><div><p className=\"section-kicker\">À découvrir</p><h3>Votre livre de recettes</h3></div></div><div className=\"preview-grid\"><button className=\"preview-card featured\" type=\"button\" onClick={() => goTo('grandma')}><span className=\"card-icon\">📖</span><h4>Recettes de Mamie</h4><p>Les recettes originales et leurs documents manuscrits.</p></button><button className=\"preview-card\" type=\"button\" onClick={() => goTo('recipes')}><span className=\"card-icon\">👨‍👩‍👧‍👦</span><h4>Recettes de la famille</h4><p>Les recettes partagées et enrichies par chacun.</p></button><button className=\"preview-card\" type=\"button\" onClick={() => goTo('favorites')}><span className=\"card-icon\">❤️</span><h4>Mes favoris</h4><p>Retrouvez rapidement les recettes que vous aimez.</p></button></div></section>}</>}"""
          if old_block not in text:
              raise SystemExit('Expected favorites render block not found')
          text = text.replace(old_block, new_block, 1)
          path.write_text(text)

      - name: Add favorites styles
        shell: bash
        run: |
          cat >> src/index.css <<'EOF'

/* Favorites */
.favorites-section{padding:48px 0 80px}.favorites-header{display:flex;align-items:flex-end;justify-content:space-between;gap:24px;margin-bottom:28px}.favorites-header h2{margin:0;font-family:'Playfair Display',Georgia,serif;font-size:clamp(2.3rem,5vw,4rem);line-height:1.05}.favorites-header>div:first-child>p:last-child{margin:12px 0 0;color:#756a61;line-height:1.6}.favorites-section .recipe-card{position:relative}.recipe-card-open{display:block;width:100%;border:0;background:transparent;color:inherit;padding:0;text-align:left}.favorite-remove{position:absolute;top:14px;right:14px;width:38px;height:38px;border:1px solid #ead6bd;border-radius:50%;background:rgba(255,253,249,.94);color:#8b4930;font-size:1.1rem;box-shadow:0 5px 14px rgba(72,45,25,.08)}.favorite-remove:hover{background:#f8eee2}.favorites-section .form-error{margin-bottom:18px}@media(max-width:900px){.favorites-header{align-items:flex-start;flex-direction:column}}
EOF

      - name: Commit integration and remove temporary workflow
        shell: bash
        run: |
          rm .github/workflows/one-time-favorites.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/App.jsx src/index.css .github/workflows/one-time-favorites.yml
          git commit -m "feat: integrate functional favorites"
          git push
